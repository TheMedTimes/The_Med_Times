name: Update Puzzle Index

on:
  push:
    branches: [main]
    paths:
      - 'puzzles/**.json'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate puzzles/index.json
        run: |
          cd puzzles
          # Get all dated puzzle files (YYYY-MM-DD.json), exclude index.json itself
          files=$(ls [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].json 2>/dev/null | sed 's/\.json//' | sort)
          # Build JSON array
          echo "[" > index.json
          first=true
          for f in $files; do
            if [ "$first" = true ]; then
              echo "  \"$f\"" >> index.json
              first=false
            else
              echo "  ,\"$f\"" >> index.json
            fi
          done
          echo "]" >> index.json
          echo "Generated index.json with entries:"
          cat index.json

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add puzzles/index.json
          if git diff --staged --quiet; then
            echo "No changes to index.json"
          else
            git commit -m "Auto-update puzzles/index.json"
            git push
          fi
